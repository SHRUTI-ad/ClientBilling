{% extends "base.html" %}
{% block title %}Edit Entry{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <a href="{{ url_for('client_detail', client_id=charge.client_id) }}" class="text-decoration-none small"><i class="bi bi-arrow-left"></i> Back to client</a>
    <h1 class="page-title h3 mt-2 mb-3">Edit Added Amount</h1>
    <div class="card card-soft">
      <div class="card-body p-4">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Date added</label>
            <input type="date" name="charge_date" class="form-control" value="{{ charge.charge_date.isoformat() }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Billing month</label>
            <input type="month" name="billing_month" class="form-control" value="{{ charge.billing_month }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <input type="text" name="description" class="form-control" value="{{ charge.description }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Amount added</label>
            <input type="number" step="0.01" min="0.01" name="amount" class="form-control" value="{{ charge.amount }}" required>
          </div>
          <button type="submit" class="btn btn-brand">Save Changes</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}

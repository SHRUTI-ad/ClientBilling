{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <h1 class="page-title h3 mb-1">Business Settings</h1>
    <p class="text-muted mb-4">These details appear on PDF invoices.</p>
    <div class="card card-soft">
      <div class="card-body p-4">
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Business / your name</label>
            <input type="text" name="business_name" class="form-control" value="{{ biz.business_name }}" required>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" name="business_email" class="form-control" value="{{ biz.business_email }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone</label>
              <input type="text" name="business_phone" class="form-control" value="{{ biz.business_phone }}">
            </div>
          </div>
          <div class="mb-3 mt-3">
            <label class="form-label">Address</label>
            <textarea name="business_address" class="form-control" rows="3">{{ biz.business_address }}</textarea>
          </div>
          <div class="mb-4">
            <label class="form-label">Currency symbol</label>
            <input type="text" name="currency_symbol" class="form-control" style="max-width:100px" value="{{ biz.currency_symbol }}">
          </div>
          <button type="submit" class="btn btn-brand">Save Settings</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
